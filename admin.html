<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Barberías</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-page-container {
            max-width: 900px;
            margin: 2.5rem auto 4rem;
            padding: 0 1.2rem;
        }
        .admin-login-box {
            max-width: 400px;
            margin: 4rem auto;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .shops-list-clean {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .shop-row-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            transition: var(--transition);
        }
        .shop-row-card:hover {
            border-color: var(--border-light);
        }
        .shop-row-card.is-blocked {
            border-left: 4px solid var(--red);
            opacity: 0.85;
        }
        .shop-row-card.is-active {
            border-left: 4px solid var(--green);
        }
        .btn-status-toggle {
            padding: 0.55rem 1.1rem;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }
        .btn-status-toggle.active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            border: 1px solid var(--green);
        }
        .btn-status-toggle.active:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
            border-color: var(--red);
        }
        .btn-status-toggle.blocked {
            background: rgba(239, 68, 68, 0.25);
            color: var(--red);
            border: 1px solid var(--red);
        }
        .btn-status-toggle.blocked:hover {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            border-color: var(--green);
        }
    </style>
</head>
<body class="dark-theme">

    <!-- PANTALLA DE ACCESO CON CLAVE -->
    <div id="loginSection" class="admin-login-box">
        <div style="width:60px;height:60px;background:var(--gold);color:#06090e;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:1.2rem;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2 style="font-size: 1.4rem; margin-bottom: 0.4rem;">Acceso Administrador</h2>
        <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 1.5rem;">Ingresa tu clave maestra para gestionar tus barberías.</p>
        
        <form onsubmit="doLogin(event)">
            <div class="form-group">
                <input type="password" id="adminPassInput" required placeholder="Ingresa tu clave..." class="input-field" style="text-align:center; font-size:1.1rem; letter-spacing:2px;">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-large">
                <i class="fa-solid fa-arrow-right"></i> Entrar
            </button>
        </form>
        <div id="errorMsg" class="text-red mt-2" style="display:none; font-size:0.85rem; font-weight:600;">
            Contraseña incorrecta
        </div>
    </div>

    <!-- PANEL PRINCIPAL SIMPLE -->
    <div id="mainSection" class="admin-page-container" style="display:none;">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.8rem; flex-wrap:wrap; gap:1rem;">
            <div>
                <h1 style="font-size: 1.6rem;">Mis Barberías Clientes</h1>
                <p class="text-muted" style="font-size: 0.88rem;">Agrega nuevas barberías y controla su acceso si no abonan la cuota.</p>
            </div>
            <div style="display:flex; gap:0.6rem;">
                <button class="btn btn-primary" onclick="openModal('addShopModal')">
                    <i class="fa-solid fa-plus"></i> + Nueva Barbería
                </button>
                <button class="btn btn-secondary btn-sm" onclick="doLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </div>

        <!-- Lista de Barberías -->
        <div class="shops-list-clean" id="shopsListContainer"></div>

    </div>

    <!-- MODAL: AGREGAR BARBERÍA -->
    <div class="modal-overlay" id="addShopModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-store text-gold"></i> Agregar Nueva Barbería</h3>
                <button class="btn-close" onclick="closeModal('addShopModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleCreateShop(event)">
                    <div class="form-group">
                        <label>Nombre de la Barbería:</label>
                        <input type="text" id="shopNameInput" required placeholder="Ej: Barbería Elite" class="input-field">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-large mt-4">
                        <i class="fa-solid fa-check"></i> Crear Barbería y Generar Link
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script>
        const STORAGE_KEY = 'BARBERFLOW_SUPERADMIN_SHOPS_V1';
        const DEFAULT_PASS = 'admin123';

        function checkAuth() {
            if (sessionStorage.getItem('ADMIN_AUTH') === 'true') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';
                renderShops();
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('mainSection').style.display = 'none';
            }
        }

        function doLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassInput').value.trim();
            if (pass === DEFAULT_PASS) {
                sessionStorage.setItem('ADMIN_AUTH', 'true');
                checkAuth();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function doLogout() {
            sessionStorage.removeItem('ADMIN_AUTH');
            location.reload();
        }

        function getShops() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                const initial = [{ id: 'mi-barberia', name: 'Mi Barbería', status: 'active' }];
                saveShops(initial);
                return initial;
            }
            return JSON.parse(data);
        }

        function saveShops(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            // Actualizar mapa de bloqueo global
            const blockedMap = {};
            list.forEach(s => {
                blockedMap[s.id] = (s.status === 'blocked');
            });
            localStorage.setItem('BARBERFLOW_BLOCKED_SHOPS', JSON.stringify(blockedMap));
        }

        function renderShops() {
            const list = getShops();
            const container = document.getElementById('shopsListContainer');

            if (list.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:3rem; background:var(--bg-card); border-radius:var(--radius-md); border:1px dashed var(--border-color);">
                        <p class="text-muted">No tienes barberías agregadas aún.</p>
                        <button class="btn btn-primary mt-2" onclick="openModal('addShopModal')">+ Agregar tu primera barbería</button>
                    </div>
                `;
                return;
            }

            const origin = window.location.origin;
            const path = window.location.pathname.replace('admin.html', '');
            const base = `${origin}${path}`;

            container.innerHTML = list.map(shop => {
                const isBlocked = shop.status === 'blocked';
                const link = `${base}?shop=${shop.id}`;

                return `
                    <div class="shop-row-card ${isBlocked ? 'is-blocked' : 'is-active'}">
                        <div>
                            <h3 style="font-size: 1.15rem; margin-bottom: 0.2rem;">${shop.name}</h3>
                            <span class="text-muted" style="font-size: 0.8rem;">ID: <code>${shop.id}</code></span>
                        </div>

                        <div style="display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap;">
                            <button class="btn btn-secondary btn-sm" onclick="copyLink('${link}')">
                                <i class="fa-regular fa-copy"></i> Copiar Link para el Barbero
                            </button>

                            <button class="btn-status-toggle ${isBlocked ? 'blocked' : 'active'}" onclick="toggleStatus('${shop.id}')" title="Haz clic para cambiar el estado">
                                <i class="fa-solid ${isBlocked ? 'fa-lock' : 'fa-check'}"></i>
                                ${isBlocked ? 'BLOQUEADA (Sin acceso)' : 'ACTIVA (Con acceso)'}
                            </button>

                            <button class="btn-icon" title="Eliminar Barbería" onclick="removeShop('${shop.id}')">
                                <i class="fa-solid fa-trash text-muted"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleStatus(shopId) {
            const list = getShops();
            const shop = list.find(s => s.id === shopId);
            if (shop) {
                shop.status = (shop.status === 'active') ? 'blocked' : 'active';
                saveShops(list);
                renderShops();
                showToast(shop.status === 'blocked' ? `Barbería ${shop.name} bloqueada` : `Barbería ${shop.name} activada`);
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            showToast('¡Link copiado al portapapeles!');
        }

        function removeShop(shopId) {
            if (confirm('¿Eliminar esta barbería?')) {
                let list = getShops();
                list = list.filter(s => s.id !== shopId);
                saveShops(list);
                renderShops();
                showToast('Barbería eliminada');
            }
        }

        function handleCreateShop(e) {
            e.preventDefault();
            const name = document.getElementById('shopNameInput').value.trim();
            const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');

            const list = getShops();
            if (list.some(s => s.id === slug)) {
                alert('Ya existe una barbería con un nombre similar.');
                return;
            }

            list.push({
                id: slug,
                name: name,
                status: 'active'
            });

            saveShops(list);
            closeModal('addShopModal');
            document.getElementById('shopNameInput').value = '';
            renderShops();
            showToast(`Barbería "${name}" creada con éxito`);
        }

        function openModal(id) {
            document.getElementById(id)?.classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id)?.classList.remove('active');
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast success';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-green"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
